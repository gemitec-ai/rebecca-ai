<div class="drawer-overlay" [class.open]="isOpen" [class.shifted-overlay]="isAiDrawerOpen()" (click)="close()" tabindex="0" (keyup.enter)="close()" (keyup.space)="close()"></div>
<div class="drawer right-drawer glass-panel" [class.open]="isOpen" [class.shifted]="isAiDrawerOpen()">
    <div class="sheet-handle-wrap" (click)="close()" aria-hidden="true">
        <div class="sheet-handle"></div>
    </div>
    <div class="drawer-header" style="background: transparent;">
        <h3 style="display: flex; align-items: center; gap: 8px;"><span class="material-icons">{{ icon }}</span> {{ title }}</h3>
        <div style="display: flex; gap: 10px;">
            <button type="button" class="sparkle-btn" (click)="openAiCopilot()"><span class="material-icons" aria-hidden="true" style="font-size: 1.1rem;">auto_awesome</span> {{ 'common.analyze' | translate }}</button>
            <button type="button" class="close-btn" [attr.aria-label]="'common.close' | translate" (click)="close()"><span class="material-icons" aria-hidden="true">close</span></button>
        </div>
    </div>
    <div class="drawer-body">
        <ng-content></ng-content>
    </div>
</div>
