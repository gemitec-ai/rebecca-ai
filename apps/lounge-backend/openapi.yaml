openapi: 3.0.3
info:
  title: Gemitec Private Lounge BFF API
  description: |
    Isolated Backend-for-Frontend (BFF) REST contract for the Gemitec Private Lounge.
    Stores user data in dedicated `lounge_*` Firestore collections separated from Public X Bot and Admin Dashboard tables.
    Public X memory access is strictly one-way (read-only via `IPublicXMemoryReadPort`).
  version: 1.45.2
servers:
  - url: http://localhost:8083/api/v1/lounge
    description: Local Development Lounge BFF Server
security:
  - BearerAuth: []
paths:
  /health:
    get:
      summary: Health check for Private Lounge BFF
      security: []
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: lounge-backend
                  version:
                    type: string
                    example: v1.45.2

  /config:
    get:
      summary: Retrieve public client runtime configuration and dynamic persona branding
      security: []
      responses:
        '200':
          description: Runtime UI configuration and active persona metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoungeRuntimeConfigDto'

  /auth/signup:
    post:
      summary: Register a Private Lounge user via X OAuth after scroll-verified disclaimer consent
      security: []
      description: |
        Requires verified Firebase/X OAuth identity in body (`idToken`, `xOAuthCode`) and explicit acceptance
        of Gemini training usage, zero-PII prohibition, and one-way memory isolation after scrolling to bottom.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoungeSignUpRequestDto'
      responses:
        '201':
          description: Registered Private Lounge session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoungeAuthSessionDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/login:
    post:
      summary: Sign in an existing X-linked Private Lounge user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoungeLoginRequestDto'
      responses:
        '200':
          description: Authenticated session restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoungeAuthSessionDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/logout:
    post:
      summary: Revoke current Private Lounge session
      responses:
        '204':
          description: Logged out cleanly
        '401':
          $ref: '#/components/responses/Unauthorized'

  /account:
    get:
      summary: Retrieve Private Lounge profile, subscription tier, remaining turns, and sync status
      responses:
        '200':
          description: Account and subscription summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoungeAccountSummaryDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions:
    get:
      summary: List Private Lounge chat sessions with bounded pagination
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/StartAfterIdParam'
      responses:
        '200':
          description: Paginated list of Private Lounge sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoungeSessionListResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a new isolated Private Lounge conversation session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoungeCreateSessionRequestDto'
      responses:
        '201':
          description: Created Private Lounge session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoungeSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sessions/{sessionId}/messages:
    get:
      summary: Retrieve paginated chat turns for a Private Lounge session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/StartAfterIdParam'
      responses:
        '200':
          description: Paginated session messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoungeMessageListResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Send a user message and receive assistant reply (consumes 1 daily chat turn)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoungeSendMessageRequestDto'
      responses:
        '201':
          description: Message turn persisted and assistant reply returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoungeSendMessageResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Daily chat turn quota exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /rewards:
    get:
      summary: List collectible illustration rewards with bounded pagination
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/StartAfterIdParam'
      responses:
        '200':
          description: Paginated collectible illustration rewards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoungeRewardListResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    StartAfterIdParam:
      name: startAfterId
      in: query
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request parameters or unverified disclaimer consent
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Suspended, inactive, or duplicate Lounge account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    LoungeEmotionState:
      type: string
      enum: [NEUTRAL, HAPPY, TEASING, SHY, EXCITED, THOUGHTFUL]
    LoungePersonaBranding:
      type: object
      required: [displayName, englishName, brandName, avatarPath]
      properties:
        displayName:
          type: string
        englishName:
          type: string
        brandName:
          type: string
        avatarPath:
          type: string
    LoungeRuntimeConfigDto:
      type: object
      required: [appVersion, disclaimerVersion, persona]
      properties:
        appVersion:
          type: string
        disclaimerVersion:
          type: string
        persona:
          $ref: '#/components/schemas/LoungePersonaBranding'
    LoungeUserDisclaimerConsent:
      type: object
      required:
        - disclaimerVersion
        - agreedToGeminiTrainingUsage
        - agreedToZeroPiiProhibition
        - agreedToOneWayMemoryIsolation
        - scrolledToBottomAt
        - consentedAt
      properties:
        disclaimerVersion:
          type: string
        agreedToGeminiTrainingUsage:
          type: boolean
        agreedToZeroPiiProhibition:
          type: boolean
        agreedToOneWayMemoryIsolation:
          type: boolean
        scrolledToBottomAt:
          type: string
          format: date-time
        consentedAt:
          type: string
          format: date-time
    LoungeUser:
      type: object
      required: [uid, xUserId, xHandle, displayName, avatarUrl, status, disclaimerConsent, createdAt, updatedAt, lastLoginAt]
      properties:
        uid:
          type: string
        xUserId:
          type: string
        xHandle:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
        disclaimerConsent:
          $ref: '#/components/schemas/LoungeUserDisclaimerConsent'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
    LoungeSubscription:
      type: object
      required: [uid, tier, status, dailyTurnQuota, remainingChatTurns, quotaResetAt, currentPeriodEnd, updatedAt]
      properties:
        uid:
          type: string
        tier:
          type: string
          enum: [FREE, SUPPORTER, VIP]
        status:
          type: string
          enum: [ACTIVE, PAST_DUE, CANCELED]
        dailyTurnQuota:
          type: integer
        remainingChatTurns:
          type: integer
        quotaResetAt:
          type: string
          format: date-time
        stripeCustomerId:
          type: string
        currentPeriodEnd:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LoungeSession:
      type: object
      required: [id, uid, title, messageCount, currentEmotion, publicXMemorySyncedAt, lastMessagePreview, createdAt, updatedAt]
      properties:
        id:
          type: string
        uid:
          type: string
        title:
          type: string
        messageCount:
          type: integer
        currentEmotion:
          $ref: '#/components/schemas/LoungeEmotionState'
        publicXMemorySyncedAt:
          type: string
          format: date-time
        lastMessagePreview:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
    LoungeTokenUsage:
      type: object
      required: [promptTokens, candidatesTokens, totalTokens]
      properties:
        promptTokens:
          type: integer
        candidatesTokens:
          type: integer
        totalTokens:
          type: integer
    LoungeMessage:
      type: object
      required: [id, sessionId, uid, role, content, emotion, createdAt]
      properties:
        id:
          type: string
        sessionId:
          type: string
        uid:
          type: string
        role:
          type: string
          enum: [USER, ASSISTANT, SYSTEM]
        content:
          type: string
        emotion:
          $ref: '#/components/schemas/LoungeEmotionState'
        unlockedRewardId:
          type: string
        tokenUsage:
          $ref: '#/components/schemas/LoungeTokenUsage'
        createdAt:
          type: string
          format: date-time
    LoungeReward:
      type: object
      required: [id, uid, code, titleJa, titleEn, descriptionJa, descriptionEn, emotionTag, rarity, previewAssetPath, unlocked]
      properties:
        id:
          type: string
        uid:
          type: string
        code:
          type: string
        titleJa:
          type: string
        titleEn:
          type: string
        descriptionJa:
          type: string
        descriptionEn:
          type: string
        emotionTag:
          $ref: '#/components/schemas/LoungeEmotionState'
        rarity:
          type: string
          enum: [SR, SSR, UR]
        previewAssetPath:
          type: string
        unlocked:
          type: boolean
        unlockedAt:
          type: string
          format: date-time
        sourceSessionId:
          type: string
    LoungeSignUpRequestDto:
      type: object
      required: [idToken, xOAuthCode, disclaimerConsent]
      properties:
        idToken:
          type: string
        xOAuthCode:
          type: string
        disclaimerConsent:
          $ref: '#/components/schemas/LoungeUserDisclaimerConsent'
    LoungeLoginRequestDto:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
        xOAuthCode:
          type: string
    LoungeAuthSessionDto:
      type: object
      required: [user, appVersion, issuedAt]
      properties:
        user:
          $ref: '#/components/schemas/LoungeUser'
        appVersion:
          type: string
        issuedAt:
          type: string
          format: date-time
    LoungeAccountSummaryDto:
      type: object
      required: [user, subscription, publicXMemoryOneWayActive, unlockedRewardCount, totalRewardCount, appVersion]
      properties:
        user:
          $ref: '#/components/schemas/LoungeUser'
        subscription:
          $ref: '#/components/schemas/LoungeSubscription'
        persona:
          $ref: '#/components/schemas/LoungePersonaBranding'
        publicXMemoryOneWayActive:
          type: boolean
        unlockedRewardCount:
          type: integer
        totalRewardCount:
          type: integer
        appVersion:
          type: string
    LoungeSessionListResponseDto:
      type: object
      required: [items, nextCursor, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LoungeSession'
        nextCursor:
          type: string
          nullable: true
        totalCount:
          type: integer
    LoungeCreateSessionRequestDto:
      type: object
      properties:
        title:
          type: string
    LoungeSendMessageRequestDto:
      type: object
      required: [content]
      properties:
        content:
          type: string
    LoungeSendMessageResponseDto:
      type: object
      required: [session, userMessage, assistantMessage, remainingChatTurns]
      properties:
        session:
          $ref: '#/components/schemas/LoungeSession'
        userMessage:
          $ref: '#/components/schemas/LoungeMessage'
        assistantMessage:
          $ref: '#/components/schemas/LoungeMessage'
        remainingChatTurns:
          type: integer
        unlockedReward:
          $ref: '#/components/schemas/LoungeReward'
    LoungeMessageListResponseDto:
      type: object
      required: [items, nextCursor, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LoungeMessage'
        nextCursor:
          type: string
          nullable: true
        totalCount:
          type: integer
    LoungeRewardListResponseDto:
      type: object
      required: [items, unlockedCount, totalCount, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LoungeReward'
        unlockedCount:
          type: integer
        totalCount:
          type: integer
        nextCursor:
          type: string
          nullable: true
