openapi: 3.0.3
info:
  title: Gemitec Private Lounge BFF API
  description: |
    Isolated Backend-for-Frontend (BFF) REST contract for the Gemitec Private Lounge.
    Enforces 1 X account = 1 Private Lounge account = 1 continuous conversation session.
    Stores user data in dedicated `lounge_*` Firestore collections separated from Public X Bot and Admin Dashboard tables.
    Public X memory access (user profile, recent turns, vector RAG, and the active persona's Layer 1/2/3 post memories)
    and Bot image asset lookups are strictly read-only.
  version: 1.45.2
servers:
  - url: http://localhost:8083/api/v1/lounge
    description: Local Development Lounge BFF Server
security:
  - BearerAuth: []
paths:
  /health:
    get:
      summary: Health check for Private Lounge BFF
      security: []
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: lounge-backend
                  version:
                    type: string
                    example: v1.45.2

  /config:
    get:
      summary: Retrieve public client runtime configuration and dynamic persona branding
      security: []
      responses:
        '200':
          description: Runtime UI configuration and active persona metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoungeRuntimeConfigDto'

  /auth/signup:
    post:
      summary: Register a Private Lounge user via X OAuth after scroll-verified disclaimer consent (1 account per X account)
      security: []
      description: |
        Requires verified Firebase/X OAuth identity in body (`idToken`, `xOAuthCode`) and explicit acceptance
        of Gemini training usage, zero-PII prohibition, and session isolation after scrolling to bottom.
        Returns 409 Conflict if the X account or Firebase UID is already registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoungeSignUpRequestDto'
      responses:
        '201':
          description: Registered Private Lounge session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoungeAuthSessionDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      summary: Sign in an existing X-linked Private Lounge user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoungeLoginRequestDto'
      responses:
        '200':
          description: Authenticated session restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoungeAuthSessionDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/logout:
    post:
      summary: Revoke current Private Lounge session
      responses:
        '204':
          description: Logged out cleanly
        '401':
          $ref: '#/components/responses/Unauthorized'

  /account:
    get:
      summary: Retrieve Private Lounge profile, subscription tier, remaining turns, and gallery summary
      responses:
        '200':
          description: Account and subscription summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoungeAccountSummaryDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Permanently withdraw and cascade-delete Private Lounge account, singleton session, memories, and gallery (no refunds)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoungeDeleteAccountRequestDto'
      responses:
        '204':
          description: Account, singleton session, messages, Dreaming/RAG memories, gallery, and subscription deleted permanently
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /account/preferences:
    patch:
      summary: Update user UI/response language, IANA timezone preferences, or onboarding completion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoungeUpdatePreferencesRequestDto'
      responses:
        '200':
          description: Updated user profile with validated preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoungeUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /account/consent:
    post:
      summary: Record scroll-verified user acceptance of updated legal/privacy disclaimer version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoungeUpdateDisclaimerConsentRequestDto'
      responses:
        '200':
          description: Updated user profile carrying latest accepted disclaimerVersion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoungeUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /session:
    get:
      summary: Retrieve (or initialize) the authenticated user's single continuous Private Lounge session
      responses:
        '200':
          description: Authenticated user's single persistent Private Lounge session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoungeSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /session/messages:
    get:
      summary: Retrieve paginated chat turns for the authenticated user's single Private Lounge session
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/StartAfterIdParam'
      responses:
        '200':
          description: Paginated session messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoungeMessageListResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Send a user message in the single Private Lounge session and receive assistant reply with two-layer memory injection and optional matched Bot illustration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoungeSendMessageRequestDto'
      responses:
        '201':
          description: Message turn persisted, assistant reply returned, and matched Bot illustration saved to Gallery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoungeSendMessageResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Daily chat turn quota exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gallery:
    get:
      summary: List Bot illustrations collected in user's Gallery with bounded pagination
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/StartAfterIdParam'
      responses:
        '200':
          description: Paginated gallery items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoungeGalleryListResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    StartAfterIdParam:
      name: startAfterId
      in: query
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request parameters, locale preference, or confirmation flags
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, or unregistered Firebase authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Account is suspended, subscription is inactive, or updated disclaimer consent is required (`DISCLAIMER_RECONSENT_REQUIRED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Account already exists for this X identity (1 X account = 1 Private Lounge account)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Optional machine-readable rejection code (e.g., DISCLAIMER_RECONSENT_REQUIRED)
        requiredDisclaimerVersion:
          type: integer
          minimum: 1
        acceptedDisclaimerVersion:
          type: integer
          minimum: 0
    LoungeLanguage:
      type: string
      enum: [ja, en, de, pt, es, zh-HK, vi, th]
    LoungeEmotionState:
      type: string
      enum: [NEUTRAL, HAPPY, TEASING, SHY, EXCITED, THOUGHTFUL, SURPRISED]
    LoungePersonaBranding:
      type: object
      required: [displayName, englishName, brandName, avatarPath, chatIconPath, emotionAvatarPaths]
      properties:
        displayName:
          type: string
        englishName:
          type: string
        brandName:
          type: string
        avatarPath:
          type: string
        chatIconPath:
          type: string
        emotionAvatarPaths:
          type: object
          additionalProperties:
            type: string
    LoungeRuntimeConfigDto:
      type: object
      required: [appVersion, disclaimerVersion, persona]
      properties:
        appVersion:
          type: string
        disclaimerVersion:
          type: integer
          minimum: 1
        persona:
          $ref: '#/components/schemas/LoungePersonaBranding'
    LoungeUserDisclaimerConsent:
      type: object
      required:
        - disclaimerVersion
        - agreedToGeminiTrainingUsage
        - agreedToZeroPiiProhibition
        - agreedToOneWayMemoryIsolation
        - scrolledToBottomAt
        - consentedAt
      properties:
        disclaimerVersion:
          type: integer
          minimum: 1
        agreedToGeminiTrainingUsage:
          type: boolean
        agreedToZeroPiiProhibition:
          type: boolean
        agreedToOneWayMemoryIsolation:
          type: boolean
        scrolledToBottomAt:
          type: string
          format: date-time
        consentedAt:
          type: string
          format: date-time
    LoungeUser:
      type: object
      required: [uid, xUserId, xHandle, displayName, avatarUrl, status, language, timezone, onboardingCompleted, disclaimerConsent, createdAt, updatedAt, lastLoginAt]
      properties:
        uid:
          type: string
        xUserId:
          type: string
        xHandle:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
        language:
          $ref: '#/components/schemas/LoungeLanguage'
        timezone:
          type: string
        onboardingCompleted:
          type: boolean
        disclaimerConsent:
          $ref: '#/components/schemas/LoungeUserDisclaimerConsent'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
    LoungeDeleteAccountRequestDto:
      type: object
      required: [confirmedIrreversibleDeletion, confirmedNoRefundForRemainingTurns]
      properties:
        confirmedIrreversibleDeletion:
          type: boolean
        confirmedNoRefundForRemainingTurns:
          type: boolean
    LoungeUpdatePreferencesRequestDto:
      type: object
      properties:
        language:
          $ref: '#/components/schemas/LoungeLanguage'
        timezone:
          type: string
        completeOnboarding:
          type: boolean
    LoungeUpdateDisclaimerConsentRequestDto:
      type: object
      required: [disclaimerConsent]
      properties:
        disclaimerConsent:
          $ref: '#/components/schemas/LoungeUserDisclaimerConsent'
    LoungeSubscription:
      type: object
      required: [uid, tier, status, dailyTurnQuota, remainingChatTurns, quotaResetAt, currentPeriodEnd, updatedAt]
      properties:
        uid:
          type: string
        tier:
          type: string
          enum: [FREE, SUPPORTER, VIP]
        status:
          type: string
          enum: [ACTIVE, PAST_DUE, CANCELED]
        dailyTurnQuota:
          type: integer
        remainingChatTurns:
          type: integer
        quotaResetAt:
          type: string
          format: date-time
        stripeCustomerId:
          type: string
        currentPeriodEnd:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LoungeSession:
      type: object
      required: [id, uid, title, messageCount, currentEmotion, publicXMemorySyncedAt, lastMessagePreview, createdAt, updatedAt]
      properties:
        id:
          type: string
        uid:
          type: string
        title:
          type: string
        messageCount:
          type: integer
        currentEmotion:
          $ref: '#/components/schemas/LoungeEmotionState'
        publicXMemorySyncedAt:
          type: string
          format: date-time
        lastMessagePreview:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
    LoungeTokenUsage:
      type: object
      required: [promptTokens, candidatesTokens, totalTokens]
      properties:
        promptTokens:
          type: integer
        candidatesTokens:
          type: integer
        totalTokens:
          type: integer
    LoungeMessage:
      type: object
      required: [id, sessionId, uid, role, content, emotion, createdAt]
      properties:
        id:
          type: string
        sessionId:
          type: string
        uid:
          type: string
        role:
          type: string
          enum: [USER, ASSISTANT, SYSTEM]
        content:
          type: string
        emotion:
          $ref: '#/components/schemas/LoungeEmotionState'
        imageAssetId:
          type: string
        imageUrl:
          type: string
        tokenUsage:
          $ref: '#/components/schemas/LoungeTokenUsage'
        createdAt:
          type: string
          format: date-time
    LoungeGalleryItem:
      type: object
      required: [id, uid, assetId, imageUrl, unlocked]
      properties:
        id:
          type: string
        uid:
          type: string
        assetId:
          type: string
        imageUrl:
          type: string
        unlocked:
          type: boolean
        unlockedAt:
          type: string
          format: date-time
        sourceSessionId:
          type: string
    LoungeSignUpRequestDto:
      type: object
      required: [idToken, xOAuthCode, disclaimerConsent]
      properties:
        idToken:
          type: string
        xOAuthCode:
          type: string
        disclaimerConsent:
          $ref: '#/components/schemas/LoungeUserDisclaimerConsent'
        language:
          $ref: '#/components/schemas/LoungeLanguage'
        timezone:
          type: string
    LoungeLoginRequestDto:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
        xOAuthCode:
          type: string
    LoungeAuthSessionDto:
      type: object
      required: [user, appVersion, issuedAt]
      properties:
        user:
          $ref: '#/components/schemas/LoungeUser'
        appVersion:
          type: string
        issuedAt:
          type: string
          format: date-time
    LoungeAccountSummaryDto:
      type: object
      required: [user, subscription, unlockedGalleryCount, totalGalleryCount, appVersion]
      properties:
        user:
          $ref: '#/components/schemas/LoungeUser'
        subscription:
          $ref: '#/components/schemas/LoungeSubscription'
        persona:
          $ref: '#/components/schemas/LoungePersonaBranding'
        unlockedGalleryCount:
          type: integer
        totalGalleryCount:
          type: integer
        appVersion:
          type: string
    LoungeSendMessageRequestDto:
      type: object
      required: [content]
      properties:
        content:
          type: string
    LoungeSendMessageResponseDto:
      type: object
      required: [session, userMessage, assistantMessage, remainingChatTurns]
      properties:
        session:
          $ref: '#/components/schemas/LoungeSession'
        userMessage:
          $ref: '#/components/schemas/LoungeMessage'
        assistantMessage:
          $ref: '#/components/schemas/LoungeMessage'
        remainingChatTurns:
          type: integer
        unlockedGalleryItem:
          $ref: '#/components/schemas/LoungeGalleryItem'
    LoungeMessageListResponseDto:
      type: object
      required: [items, nextCursor, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LoungeMessage'
        nextCursor:
          type: string
          nullable: true
        totalCount:
          type: integer
    LoungeGalleryListResponseDto:
      type: object
      required: [items, unlockedCount, totalCount, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LoungeGalleryItem'
        unlockedCount:
          type: integer
        totalCount:
          type: integer
        nextCursor:
          type: string
          nullable: true
